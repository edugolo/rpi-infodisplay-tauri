name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rpi-infodisplay-aarch64
            runner: ubuntu-24.04-arm
          - name: rpi-infodisplay-x86_64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: |
          if [[ "${{ matrix.runner }}" == "ubuntu-24.04-arm" ]]; then
            cp target/release/rpi-infodisplay target/release/rpi-infodisplay-aarch64
          else
            cp target/release/rpi-infodisplay target/release/rpi-infodisplay-x86_64
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/rpi-infodisplay-*
          generate_release_notes: true
