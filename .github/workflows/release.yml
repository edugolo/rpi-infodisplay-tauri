name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-arm:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            name: rpi-infodisplay-aarch64
            platform: linux/arm64
          - target: armv7-unknown-linux-gnueabihf
            name: rpi-infodisplay-armv7hf
            platform: linux/arm/v7

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build in ARM container
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg TARGET=${{ matrix.target }} \
            -o type=local,dest=./artifacts \
            -f Dockerfile.build \
            .
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}

      - name: Rename binary
        run: |
          cp artifacts/rpi-infodisplay ${{ matrix.name }}
          chmod +x ${{ matrix.name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
          generate_release_notes: true

  build-x86:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build
        run: cargo build --release

      - name: Rename binary
        run: |
          cp target/release/rpi-infodisplay rpi-infodisplay-x86_64
          chmod +x rpi-infodisplay-x86_64

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rpi-infodisplay-x86_64
          generate_release_notes: true
